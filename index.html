<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система мониторинга учебной группы | v2.1</title>
    <style>
        :root {
            --primary-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            color: var(--text-main);
            margin: 0;
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            padding: 28px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 600px; 
            margin-bottom: 25px; 
            box-sizing: border-box; 
        }

        h2 { margin-top: 0; font-size: 1.4rem; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eee; padding-bottom: 15px; }

        .status-info-box { 
            background: #f0f7ff; 
            border-radius: 12px; 
            padding: 18px; 
            margin-bottom: 20px; 
            border-left: 5px solid var(--primary-color); 
        }
        .info-row { display: flex; align-items: center; gap: 10px; font-size: 1rem; margin: 6px 0; }
        .info-row b { color: var(--primary-color); }

        .timer-box { 
            background: #fafafa; 
            border-radius: 12px; 
            padding: 20px; 
            text-align: center; 
            margin-bottom: 25px; 
            border: 1px dashed #d1d1d1; 
        }
        #timerDisplay { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: var(--primary-color); 
            font-family: 'Courier New', monospace; 
            letter-spacing: 2px;
        }
        .btn-session { 
            margin-top: 15px; 
            padding: 10px 25px; 
            border-radius: 25px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            transition: all 0.3s ease; 
        }
        .btn-start { background: var(--success-color); color: white; box-shadow: 0 4px 12px rgba(40,167,69,0.3); }
        .btn-stop { background: var(--danger-color); color: white; box-shadow: 0 4px 12px rgba(220,53,69,0.3); }

        .status-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0 25px 0; }
        .status-option { 
            padding: 10px 18px; 
            border: 2px solid #e9ecef; 
            border-radius: 12px; 
            background: white;
            cursor: pointer; 
            font-size: 0.95rem; 
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .status-option:hover { border-color: var(--primary-color); background: #f0f4f8; }
        .status-option.active { 
            background: var(--primary-color); 
            color: white; 
            border-color: var(--primary-color); 
            box-shadow: 0 5px 15px rgba(0,123,255,0.3); 
        }

        .btn-save { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1.1rem; 
            cursor: pointer; 
        }

        .user-item { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #f1f3f5; }
        .online-dot { 
            width: 12px; height: 12px; border-radius: 50%; background: #d1d1d1; margin-right: 18px; position: relative;
        }
        .online-dot.active { background: var(--success-color); box-shadow: 0 0 10px var(--success-color); }
        
        .username { font-weight: 600; font-size: 1.05rem; flex-grow: 1; }
        .status-tag { font-size: 0.8rem; color: var(--text-muted); background: #f8f9fa; padding: 5px 12px; border-radius: 20px; border: 1px solid #eee; }
        .session-tag { display: block; font-size: 0.75rem; color: var(--primary-color); margin-top: 4px; font-weight: 700; }

        .achievement-badge { display: inline-block; padding: 4px 8px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; font-size: 0.75rem; margin: 2px; cursor: help; }
        .rating-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; }
        .rating-rank { font-weight: bold; color: var(--primary-color); width: 30px; }

        #chatBox { height: 220px; overflow-y: auto; background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { padding: 8px 15px; background: #e9f2ff; border-radius: 10px; align-self: flex-start; max-width: 80%; font-size: 0.95rem; }
        .chat-input-container { display: flex; gap: 10px; }
        #chatInput { flex-grow: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; outline: none; }
        .btn-send { padding: 0 20px; background: var(--success-color); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👤 Личный профиль</h2>
        <div class="status-info-box">
            <div id="authContent">Выполняется проверка авторизации...</div>
        </div>
        <div id="myAchievements" style="margin-bottom: 15px;"></div>

        <div id="sessionUI" style="display:none;">
            <div class="timer-box">
                <div id="timerDisplay">00:00:00</div>
                <button id="toggleSessionBtn" class="btn-session btn-start">▶ Начать период учебы</button>
            </div>
        </div>

        <p style="font-size: 0.9rem; font-weight: 600; color: #555; margin-bottom: 8px;">Установить статус:</p>
        <div class="status-grid" id="statusPicker">
            <div class="status-option" onclick="prepStatus(this, '🟢 Онлайн')">🟢 Онлайн</div>
            <div class="status-option" onclick="prepStatus(this, '☕ Отошёл')">☕ Отошёл</div>
            <div class="status-option" onclick="prepStatus(this, '🔴 Занят')">🔴 Занят</div>
            <div class="status-option" onclick="prepStatus(this, '🍜 Обед')">🍜 Обед</div>
        </div>
        <button class="btn-save" onclick="applyStatus()">Обновить мой статус</button>
    </div>

    <div class="card">
        <h2>🏆 Топ студентов (по часам)</h2>
        <div id="leaderboard">Загрузка рейтинга...</div>
    </div>

    <div class="card">
        <h2>👥 Монитор активности группы</h2>
        <div id="groupList">Загрузка данных участников...</div>
    </div>
<div id="globalPulse" style="font-weight: bold; color: var(--primary-color); margin-bottom: 10px;">
    
</div>
    <div class="card" id="chatSection" style="display:none;">
        <h2>💬 Корпоративный чат</h2>
        <div id="chatBox">Поиск последних сообщений...</div>
        <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Введите сообщение...">
            <button class="btn-send" onclick="window.sendMessage()">➡</button>
        </div>
    </div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const URL = 'https://unnsbhztrdlonakztwtl.supabase.co';
    const KEY = 'sb_publishable_Cqmz3Pa7c9AvAuk6EmPTFQ_GovCnhpB';
    const supabase = createClient(URL, KEY);
    
    let currentUser = null;
    let tempStatus = { text: '' };
    let timerInterval = null;

    const ACHIEVEMENT_LIST = {
        'EARLY_BIRD': { icon: '🌅', title: 'Ранняя пташка', desc: 'Зашел до 8:00' },
        'MARATHON': { icon: '🏃', title: 'Марафонец', desc: 'Учился более 2 часов за раз' },
        'ACTIVIST': { icon: '📢', title: 'Активист', desc: 'Написал более 20 сообщений' }
    };

    async function checkUser() {
        const { data } = await supabase.auth.getUser();
        const infoBox = document.querySelector('#authContent');

        if (data?.user) {
            currentUser = data.user;
            document.getElementById('sessionUI').style.display = 'block';
            document.getElementById('chatSection').style.display = 'block'; 
            
            // ПРЕВРАЩАЕМ INSERT В UPSERT (Решает проблему дублей)
            const { data: profile } = await supabase.from('profiles').upsert({ 
                id: currentUser.id, 
                username: currentUser.user_metadata.full_name || currentUser.email 
            }).select().single();

            infoBox.innerHTML = `
                <div class="info-row">👨‍🎓 Пользователь: <b>${profile.username}</b></div>
                <div class="info-row">📌 Статус: <span id="currentStatusText">${profile.status || 'не установлен'}</span></div>
                <button id="logoutBtn" style="background:none; border:none; color:var(--danger-color); cursor:pointer; font-size:12px; margin-top:10px; text-decoration:underline;">Выйти</button>
            `;

            renderMyAchievements(profile.achievements);
            checkEarlyBird(profile.achievements);

            document.getElementById('logoutBtn').onclick = async () => {
                await supabase.auth.signOut();
                window.location.reload();
            };

            initSessionLogic();
            fetchGroup();
            fetchMessages(); 
            fetchLeaderboard();
            
            updateHeartbeat(); 
            setInterval(updateHeartbeat, 30000);
        } else {
            infoBox.innerHTML = `<button id="loginBtn" style="width:100%; padding:14px; cursor:pointer; border-radius:10px; border:1px solid #ddd; background:white; font-weight:bold;">Авторизация через Google</button>`;
            document.getElementById('loginBtn').onclick = () => supabase.auth.signInWithOAuth({ 
                provider: 'google', options: { redirectTo: window.location.href }
            });
        }
    }

    async function checkEarlyBird(currentAch) {
        const hour = new Date().getHours();
        const achArray = currentAch || [];
        if (hour < 8 && !achArray.includes('early_bird')) {
            const newAch = [...achArray, 'early_bird'];
            await supabase.from('profiles').update({ achievements: newAch }).eq('id', currentUser.id);
            alert("🌅 Достижение получено: Ранняя пташка!");
            renderMyAchievements(newAch);
        }
    }

    function renderMyAchievements(ach) {
        const container = document.getElementById('myAchievements');
        if (!ach || ach.length === 0) {
            container.innerHTML = '<span style="color:#999; font-size:0.8rem;">Достижений пока нет 🐣</span>';
            return;
        }
        container.innerHTML = ach.map(id => {
            const item = ACHIEVEMENT_LIST[id.toUpperCase()];
            return item ? `<span class="achievement-badge" title="${item.desc}">${item.icon} ${item.title}</span>` : '';
        }).join('');
    }

    async function initSessionLogic() {
        const btn = document.getElementById('toggleSessionBtn');
        const { data } = await supabase.from('profiles').select('is_studying, session_start').eq('id', currentUser.id).single();
        
        if (data?.is_studying && data.session_start) runLocalTimer(data.session_start);

        btn.onclick = async () => {
            const isStarting = btn.classList.contains('btn-start');
            const startTime = isStarting ? new Date().toISOString() : null;
            
            if (!isStarting) { 
                const { data: prof } = await supabase.from('profiles').select('session_start, total_study_minutes, achievements').eq('id', currentUser.id).single();
                const diffMin = Math.floor((new Date() - new Date(prof.session_start)) / 60000);
                
                let updates = { 
                    is_studying: false, 
                    session_start: null, 
                    total_study_minutes: (prof.total_study_minutes || 0) + diffMin 
                };

                if (diffMin >= 120 && !(prof.achievements || []).includes('marathon')) {
                    updates.achievements = [...(prof.achievements || []), 'marathon'];
                    alert("🏃 Достижение получено: Марафонец!");
                }

                await supabase.from('profiles').update(updates).eq('id', currentUser.id);
                clearInterval(timerInterval);
                document.getElementById('timerDisplay').innerText = "00:00:00";
                btn.innerText = "▶ Начать период учебы";
                btn.classList.replace('btn-stop', 'btn-start');
                fetchLeaderboard();
                fetchGroup();
            } else {
                await supabase.from('profiles').update({ is_studying: true, session_start: startTime }).eq('id', currentUser.id);
                runLocalTimer(startTime);
                fetchGroup();
            }
        };
    }

    function runLocalTimer(startTime) {
        const btn = document.getElementById('toggleSessionBtn');
        btn.innerText = "⏹ Завершить период";
        btn.classList.replace('btn-start', 'btn-stop');
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const diff = Math.floor((new Date() - new Date(startTime)) / 1000);
            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${h}:${m}:${s}`;
        }, 1000);
    }

    async function fetchLeaderboard() {
        const { data } = await supabase.from('profiles').select('username, total_study_minutes').order('total_study_minutes', { ascending: false }).limit(5);
        if (data) {
            document.getElementById('leaderboard').innerHTML = data.map((user, i) => `
                <div class="rating-item">
                    <span><span class="rating-rank">#${i + 1}</span> ${user.username}</span>
                    <b>${Math.floor((user.total_study_minutes || 0) / 60)}ч ${(user.total_study_minutes || 0) % 60}м</b>
                </div>
            `).join('');
        }
    }

    async function updateHeartbeat() {
        if (currentUser) await supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);
    }

    window.prepStatus = (element, text) => {
        document.querySelectorAll('.status-option').forEach(opt => opt.classList.remove('active'));
        element.classList.add('active');
        tempStatus.text = text;
    };

    window.applyStatus = async () => {
        if (!currentUser || !tempStatus.text) return;
        await supabase.from('profiles').update({ status: tempStatus.text }).eq('id', currentUser.id);
        document.getElementById('currentStatusText').innerText = tempStatus.text;
        fetchGroup();
    };

    async function fetchGroup() {
        const { data } = await supabase.from('profiles').select('*').order('username', { ascending: true });
        if (!data) return;

        document.getElementById('groupList').innerHTML = data.map(user => {
            const isOnline = user.last_seen && (new Date() - new Date(user.last_seen) < 60000);
            const badges = (user.achievements || []).map(id => {
                const item = ACHIEVEMENT_LIST[id.toUpperCase()];
                return item ? `<span title="${item.title}: ${item.desc}">${item.icon}</span>` : '';
            }).join(' ');
            
            return `
                <div class="user-item">
                    <div class="online-dot ${isOnline ? 'active' : ''}"></div>
                    <div class="username">${user.username} <span style="font-size:0.9rem; margin-left:5px;">${badges}</span></div>
                    <div class="user-meta" style="text-align:right;">
                        <div class="status-tag">${user.status || 'В сети'}</div>
                        ${user.is_studying ? `<span class="session-tag">📖 Учится</span>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.sendMessage = async () => {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentUser) return;

        await supabase.from('messages').insert({ 
            user_id: currentUser.id, 
            username: currentUser.user_metadata.full_name || currentUser.email, 
            text: text 
        });
        
        // Проверка на Активиста
        const { data: p } = await supabase.from('profiles').select('message_count, achievements').eq('id', currentUser.id).single();
        const newCount = (p.message_count || 0) + 1;
        let upds = { message_count: newCount };
        
        if (newCount >= 20 && !(p.achievements || []).includes('activist')) {
            upds.achievements = [...(p.achievements || []), 'activist'];
            alert("📢 Достижение получено: Активист!");
        }
        await supabase.from('profiles').update(upds).eq('id', currentUser.id);

        input.value = '';
        fetchMessages();
    };

    async function fetchMessages() {
        const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(20);
        if (data) {
            const box = document.getElementById('chatBox');
            box.innerHTML = data.reverse().map(m => `<div class="chat-msg"><b>${m.username.split(' ')[0]}:</b> ${m.text}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }
    }
    async function saveStudyTime(minutes) {
  // 1. Сначала узнаем, сколько минут уже есть в базе
  const { data } = await supabase
    .from('profiles')
    .select('total_study_minutes')
    .eq('id', currentUser.id)
    .single();

  // 2. Складываем старое время с новым и сохраняем
  await supabase.from('profiles').upsert({
    id: currentUser.id,
    total_study_minutes: (data?.total_study_minutes || 0) + minutes
  });
}
    async function getLeaderboard() {
  const { data } = await supabase
    .from('profiles')
    .select('username, total_study_minutes')
    .order('total_study_minutes', { ascending: false }) // От большего к меньшему
    .limit(3); // Берем только топ-3

  return data;
}

    async function giveRespect(userId) {
    // 1. Получаем текущее количество респектов этого пользователя
    const { data } = await supabase.from('profiles').select('respect_count').eq('id', userId).single();
    
    // 2. Увеличиваем на 1 и сохраняем
    await supabase.from('profiles')
        .update({ respect_count: (data.respect_count || 0) + 1 })
        .eq('id', userId);
        
    alert("Респект отправлен! 🤝");
    fetchGroup(); // Обновляем список, чтобы увидеть результат
}
    <button onclick="giveRespect('${user.id}')" style="cursor:pointer; background:none; border:none;">👍 ${user.respect_count || 0}</button>
    async function showGlobalPulse() {
    // 1. Запрашиваем время всех пользователей
    const { data } = await supabase.from('profiles').select('total_study_minutes');
    
    // 2. Складываем всё в одну переменную
    const totalMinutes = data.reduce((sum, user) => sum + (user.total_study_minutes || 0), 0);
    const totalHours = Math.floor(totalMinutes / 60);

    // 3. Выводим на экран
    document.getElementById('globalPulse').innerText = `Группа вместе проучилась: ${totalHours} ч. 🔥`;
}
    checkUser();
    setInterval(() => { fetchGroup(); fetchMessages(); }, 10000); // Обновление каждые 10 сек
</script>
</body>
</html>
